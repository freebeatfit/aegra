name: FB release

# Builds the patched aegra-api and aegra-cli wheels for a v<ver>+fb.<n> tag and
# attaches them to a GitHub Release in this private fork. See FB_PATCHES.md.
on:
  push:
    tags:
      # "+" is a filter metacharacter; escape it to match the literal tag.
      - 'v*\+fb.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<ver>+fb.<n> tag to (re)build"
        required: true

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aegra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --all-packages --frozen

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Tests
        env:
          AEGRA_CONFIG: ""
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: aegra
          AEGRA_TEST_REDIS_URL: redis://localhost:6379/15
        # test_streaming_errors.py fails on unmodified upstream v0.11.0 (FB_PATCHES.md).
        run: >-
          uv run --package aegra-api pytest libs/aegra-api/tests/unit libs/aegra-api/tests/integration
          --deselect libs/aegra-api/tests/integration/test_streaming_errors.py
          && uv run --package aegra-cli pytest libs/aegra-cli/tests

      - name: Check the tag matches the package versions
        run: |
          tag="${RELEASE_TAG#v}"
          for lib in aegra-api aegra-cli; do
            version=$(grep -m 1 '^version = ' "libs/$lib/pyproject.toml" | cut -d '"' -f 2)
            test "$version" = "$tag" || { echo "$lib is $version, tag is $tag"; exit 1; }
          done

      - name: Build wheels
        run: |
          (cd libs/aegra-api && uv build --wheel --out-dir ../../dist)
          (cd libs/aegra-cli && uv build --wheel --out-dir ../../dist)
          (cd dist && sha256sum -- *.whl > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes-file FB_PATCHES.md
